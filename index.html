<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%231A1A2A'/><text x='50' y='68' font-size='52' text-anchor='middle' fill='%23F8F5EE' font-family='monospace' font-weight='bold'>T</text></svg>">
<title>3D图形用品超市小票 - Verlet物理模拟</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { 
  overflow: hidden; 
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; 
  cursor: default;
  transition: background 0.8s ease;
}
#bgLayer {
  position: fixed; top: 0; left: 0; width: 100%; height: 100%;
  pointer-events: none; z-index: 0;
  transition: opacity 0.8s ease;
}
body.theme-warm #bgLayer {
  background: 
    radial-gradient(ellipse at 80% 25%, rgba(255,250,240,0.5) 0%, transparent 55%),
    radial-gradient(ellipse at 20% 75%, rgba(240,225,200,0.4) 0%, transparent 50%),
    radial-gradient(ellipse at 30% 20%, #FBF8F2 0%, #F0ECE2 70%, #E8E3D6 100%);
  opacity: 1;
}
body.theme-cool #bgLayer {
  background: 
    radial-gradient(ellipse at 75% 20%, rgba(235,245,255,0.5) 0%, transparent 55%),
    radial-gradient(ellipse at 25% 80%, rgba(200,215,240,0.4) 0%, transparent 50%),
    radial-gradient(ellipse at 30% 20%, #EEF2FA 0%, #DCE3EF 70%, #D0D8E8 100%);
  opacity: 1;
}
body.theme-vintage #bgLayer {
  background: 
    radial-gradient(ellipse at 80% 25%, rgba(255,245,220,0.5) 0%, transparent 55%),
    radial-gradient(ellipse at 20% 75%, rgba(220,200,170,0.35) 0%, transparent 50%),
    radial-gradient(ellipse at 30% 20%, #F3E9D4 0%, #E8DBC0 70%, #DCC9A8 100%);
  opacity: 1;
}
#bgNoise {
  position: fixed; top: 0; left: 0; width: 100%; height: 100%;
  pointer-events: none; z-index: 1;
  opacity: 0.035;
  background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)'/%3E%3C/svg%3E");
  background-size: 256px 256px;
  background-repeat: repeat;
}
canvas { display: block; position: relative; z-index: 2; }
</style>
</head>
<body>
<div id="bgLayer"></div>
<div id="bgNoise"></div>
<script type="importmap">
  {
    "imports": {
      "three": "./libs/three.module.js"
    }
  }
</script>
<script type="module" src="src/App.js"></script>
</body>
</html>
